    # weight_negrw / weight_negrw_std columns. Histogram ranges are only for QA plots.
    # ------------------------------------------------------------------
    lhe_njets:
      type: Integer
      start: 0
      stop: 6
      label: LHE $N_{jets}$
      expression: objects['lhe_njets']
    lhe_nb:
      type: Integer
      start: 0
      stop: 4
      label: LHE $N_b$
      expression: objects['lhe_nb']
    lhe_nc:
      type: Integer
      start: 0
      stop: 4
      label: LHE $N_c$
      expression: objects['lhe_nc']
    lhe_nuds:
