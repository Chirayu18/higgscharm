mva:
  train_test_split:
    field: event           # NanoAOD event id, written to parquet by base.py
    test_modulo: 10        # ~10% held out for test, ~90% for b-hive train+valid
    test_remainder: 9
  labels:
    # Order of these keys defines the one-hot class order (is_hplusc first, etc.).
    # Must match the b-hive config's `truths` order (HPlusCHToWW_multiclass.yml).
    # 6-class split: signal H+c separated from the rest of Higgs (higgsbkg).
    process_groups:
      hplusc:   [H+c]
      higgsbkg: [H+b, ggH, VBF, ZH, ggZH, WH, ttHnonBB, ttHtoBB, H(125)]
      tt:       [tt]
      st:       [Single Top]
      diboson:  [WW, WZ, ZZ, qqToZZ, ggToZZ]
      vjets:    [DY+Jets, V+Jets]
    # 13-class finegrained scheme (v32 / kappa-HCE): Higgs split into sub-classes.
    # Class keys = b-hive HPlusCHToWW_kappa_hce.yml `truths` minus the `is_` prefix
    # (note is_ggH keeps its capital H -> key `ggH`).
    process_groups_v32:
      hplusc:   [H+c]
      hplusb:   [H+b]
      ggH:      [ggH]
      vbf:      [VBF]
      zh:       [ZH]
      ggzh:     [ggZH]
      wh:       [WH]
      tthnonbb: [ttHnonBB]
      tthtobb:  [ttHtoBB]
      tt:       [tt]
      st:       [Single Top]
      diboson:  [WW, WZ, ZZ, qqToZZ, ggToZZ]
      vjets:    [DY+Jets, V+Jets]
inference:
  framework: b-hive
  model_version: hwwcom_multiclass_v11_2dcats
  model_path: /eos/user/c/cgupta/EPR_task/b-hive/output/TrainingTask/HPlusCHToWW_2dcats/hwwcom_v11_2dcats_train/hwwcom_multiclass_v11_2dcats/SimpleMLP_MultiClass/epochs_30/nominal/best_model.pt
  bhive_path: /eos/home-c/cgupta/HToWW/b-hive
  bhive_config: HPlusCHToWW_2dcats
  bhive_model_name: SimpleMLP_MultiClass
  batch_size: 4096
combine:
  # D = the network score for the class that wins argmax in each event.
  # The score column written by run_inference.py is mva_score_<class>.
  discriminant: argmax_winner_score
  # Variable binning: signal lives in P(hplusc) in [0.2,0.55] and rises toward 0.55,
  # so resolution is concentrated in [0.40,0.60]; CR tails preserved by the wide 0.6-1.0 bin.
  binning:
    edges: [0.0, 0.2, 0.3, 0.35, 0.40, 0.44, 0.48, 0.52, 0.56, 0.60, 1.0]
  # class order must match the inference model's output (CLASS_NAMES below).
  classes: [hplusc, higgsbkg, tt, st, diboson, vjets]
  signal: hplusc
  # one channel per class; the event lands in the channel of its argmax class.
  channels:
    SR_hplusc:   hplusc
    CR_higgsbkg: higgsbkg
    CR_tt:       tt
    CR_st:       st
    CR_diboson:  diboson
    CR_vjets:    vjets
  # combine process -> higgscharm process names (parquet `process` groups).
  process_map:
    hplusc:   [H+c]
    higgsbkg: [H+b, VBF, ZH, ggH, ggZH, ttHnonBB, ttHtoBB]
    tt:       [tt]
    st:       [Single Top]
    diboson:  [WW, WZ, ZZ]
    vjets:    [DY+Jets, V+Jets]
  # weight-based shape nuisances (read weight_<name>Up/Down columns from parquet).
  shape_systematics:
    - pileup
    - ps_isr
    - ps_fsr
    - scalevar_muR
    - scalevar_muF
    - scalevar_muR_muF
    - muon_id
    - muon_iso
    - electron_id
    - electron_reco_RecoBelow20
    - electron_reco_Reco20to75
    - electron_reco_RecoAbove75
    - CMS_ctag2d_2022
  # processes that skip the scalevar_* shape rows. (diboson scalevar now ENABLED =
  # the AN's diboson "theo_vv" theory shape; weights already exist in the parquets.)
  no_scalevar: []
  # data-driven backgrounds: floating normalization (rateParam, shared CR->SR) replaces
  # their xsec lnN, and their theory shapes (scalevar_*, ps_*) are dropped (AN-23-102:
  # tt normalization taken from data). higgsbkg stays fixed to SM -> keeps the 1POI fit.
  # Only tt is data-driven: CR_tt is the one tt-pure control region (tt=37670). The other
  # argmax CRs are tt-dominated, so floating their target bkg leaves it weakly constrained
  # and adds SR background freedom. st/diboson/vjets keep their (small) xsec lnN, as in AN-23-102.
  rate_params: [tt]
  no_theory:   [tt]
  # rate-only nuisances (AN-23-102 Table 16 + LumiPOG). value can be a float
  # or an asymmetric "down/up" string.
  lnN:
    lumi_13p6TeV:        {hplusc: 1.014, higgsbkg: 1.014, st: 1.014, diboson: 1.014, vjets: 1.014}
    xsec_st:             {st: "0.9873/1.0167"}
    xsec_diboson:        {diboson: 1.037}
    xsec_vjets:          {vjets: 1.027}
    xsec_higgsbkg:       {higgsbkg: 1.05}
    # Higgs heavy-flavour composition (AN-23-102 7.1: 50% on the ggH yield). ggH is ~80%
    # of the merged higgsbkg here, so 0.5*0.8 ~= 0.40 effective. PLACEHOLDER until ggH is
    # split out of higgsbkg (then apply the full 1.50 to the ggH component only).
    flavor_composition_ggH: {higgsbkg: 1.40}
    BR_HtoWW:            {hplusc: 1.01, higgsbkg: 1.01}
    xsec_hplusc_PDF:     {hplusc: 1.06}
    xsec_hplusc_4FS_5FS: {hplusc: 1.30}
    alphaS_PDF:          {hplusc: 1.03, higgsbkg: 1.03, st: 1.03, diboson: 1.03, vjets: 1.03}
  # LOWESS smoothing DISABLED 2026-07-31. The negrw reweighting applied in
  # process_sample (w -> |w|*g, renormalised to the nominal yield, arXiv:2510.16217)
  # already removes the MC-stat variance at the source for the vjets templates, and
  # its docstring states it REPLACES the template smoothing ("do not also smooth").
  # smooth_shape_variations had no vjets exclusion, so those templates were being
  # treated twice - washing out genuine shape information. Turned off for all
  # processes; autoMCStats still covers per-bin MC-stat uncertainty.
  smooth_shapes: false
  autoMCStats: 10
  output:
    root:     outputs/combine/v11_hplusc_looseWP.root
    datacard: outputs/combine/v11_hplusc_looseWP.txt
    workspace: v11_hplusc_looseWP.workspace.root
  run:
    asymptotic_limits: {asimov: true, blind: true}
    multidimfit_scan:  {algo: grid, range_r: [-5, 5], points: 41}
    impacts: {method: freeze_per_nuisance}
