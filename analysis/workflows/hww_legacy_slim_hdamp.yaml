# Dedicated hDamp alternatives; never mix into nominal training.
combine:
  autoMCStats: 10
  binning:
    edges:
    - 0.0
    - 0.2
    - 0.3
    - 0.35
    - 0.4
    - 0.44
    - 0.48
    - 0.52
    - 0.56
    - 0.6
    - 1.0
  channels:
    CR_diboson: diboson
    CR_higgsbkg: higgsbkg
    CR_st: st
    CR_tt: tt
    CR_vjets: vjets
    SR_hplusc: hplusc
  classes:
  - hplusc
  - higgsbkg
  - tt
  - st
  - diboson
  - vjets
  discriminant: argmax_winner_score
  lnN:
    BR_Htautau:
      higgsbkg: 1.01
    BR_HtoWW:
      higgsbkg: 1.01
      hplusc: 1.01
    lumi_13p6TeV:
      diboson: 1.014
      higgsbkg: 1.014
      hplusc: 1.014
      st: 1.014
      vjets: 1.014
    xsec_diboson:
      diboson: 1.037
    xsec_higgsbkg:
      higgsbkg: 1.05
    xsec_hplusc_PDF:
      hplusc: 1.074
    xsec_st:
      st: 0.9873/1.0167
    xsec_vjets:
      vjets: 1.027
  no_scalevar: []
  no_theory:
  - tt
  output:
    datacard: outputs/combine/routeb/v13_hplusc_routeb_3fs4fs.txt
    root: outputs/combine/routeb/v13_hplusc_routeb_3fs4fs.root
    workspace: v13_hplusc_routeb_3fs4fs.workspace.root
  process_map:
    diboson:
    - WW
    - WZ
    - ZZ
    - WG
    higgsbkg:
    - H+b
    - VBF
    - ZH
    - WH
    - ggH
    - ggZH
    - ttHnonBB
    - ttHtoBB
    hplusc:
    - H+c
    st:
    - Single Top
    tt:
    - tt
    vjets:
    - DY+Jets
    - V+Jets
  rate_params:
  - tt
  run:
    asymptotic_limits:
      asimov: true
      blind: true
    impacts:
      method: freeze_per_nuisance
    multidimfit_scan:
      algo: grid
      points: 41
      range_r:
      - -5
      - 5
  shape_systematics:
  - CMS_pileup_2022
  - ps_isr
  - ps_fsr
  - scalevar_muR
  - scalevar_muF
  - scalevar_muR_muF
  - CMS_eff_m_id_2022
  - CMS_eff_m_iso_2022
  - CMS_eff_e_id_2022
  - CMS_eff_e_reco_below20_2022
  - CMS_eff_e_reco_20to75_2022
  - CMS_eff_e_reco_above75_2022
  - CMS_ctag2d_2022
  - CMS_eff_m_promptMVA_2022
  - CMS_eff_e_promptMVA_2022
  - lhe_pdf
  - lhe_alphaS
  - top_pt
  - higgs_plus_c
  signal: hplusc
  smooth_shapes: false
corrections:
  event_weights:
    ctagging_2d: true
    electron:
    - id: Medium
    - promptMVA: ttHMVA_Run3
    - reco: true
    - trigger: false
    genWeight: true
    higgsHFWeight: true
    hpluscFSShape: []
    lhe_renorm_datasets:
    - HplusCharm_4FS_HToWWTo2L2Nu
    - HplusBottom_5FS_HToWWTo2L2Nu
    lhepdfWeight: true
    lhescaleWeight: true
    muon:
    - id: tight_HWW
    - iso: tight_HWW
    - promptMVA: tight_HWW
    - trigger: false
    nnlopsWeight: true
    partonshowerWeight: true
    pileupWeight: true
    toppTWeight: true
  object:
  - tthMVA
  - jet
  - jetveto
  - muon
  - electron
  - met_phi
  - propagate_leptons_to_met
  object_shifts: true
datasets:
  mc:
  - tt_hdamp
event_selection:
  categories:
    base:
    - atleast_one_goodvertex
    - lumimask
    - met_filters
    - trigger
    - met_45
    - one_ll_pair
    - one_muon_one_electron
    - atleast_one_cjet
  hlt_paths:
    EGamma:
    - SingleEle
    Muon:
    - SingleMu
    MuonEG:
    - MuEle
  selections:
    atleast_one_cjet: ak.num(objects['cjets']) > 0
    atleast_one_goodvertex: events.PV.npvsGood > 0
    atleast_one_jet: ak.num(objects['jets']) > 0
    atleast_two_cjets: ak.num(objects['cjets']) > 1
    dilepton_mass_signal: ak.all((objects["ll_pair"].l1 + objects["ll_pair"].l2).mass
      <= 72, axis=1)
    dilepton_mass_top_CR: ak.all((objects["ll_pair"].l1 + objects["ll_pair"].l2).mass
      > 72, axis=1)
    lumimask: get_lumi_mask(events, year)
    met_45: objects['met'].pt > 45
    met_filters: get_metfilters_mask(events, year)
    one_electron: ak.num(objects['electrons']) == 1
    one_ll_pair: ak.num(objects['ll_pair']) == 1
    one_muon: ak.num(objects['muons']) == 1
    one_muon_one_electron: ak.all(((abs(objects['ll_pair'].l1.pdgId) == 11) & (abs(objects['ll_pair'].l2.pdgId)
      == 13)) | ((abs(objects['ll_pair'].l1.pdgId) == 13) & (abs(objects['ll_pair'].l2.pdgId)
      == 11)), axis=1)
    transverse_mass_signal: ak.all((objects["mTl2"] > 30) & (objects["mTll"] > 60),
      axis=1)
    transverse_mass_top_CR: ak.all((objects["mTl2"] > 30) & (objects["mTll"] <= 60),
      axis=1)
    trigger: get_trigger_mask(events, hlt_paths, dataset, year)
    zero_eventJets: ak.num(objects['eventJets']) == 0
    zero_jets: ak.num(objects['jets']) == 0
histogram_config:
  add_syst_axis: true
  add_weight: true
  axes:
    cjet_cand_cvsb_pnet:
      bins: 50
      expression: ak.pad_none(objects['candidate_cjet'], target=1).btagPNetCvB
      label: Candidate c-jet CvsB (PNet)
      start: 0
      stop: 1
      type: Regular
    cjet_cand_cvsl_pnet:
      bins: 50
      expression: ak.pad_none(objects['candidate_cjet'], target=1).btagPNetCvL
      label: Candidate c-jet CvsL (PNet)
      start: 0
      stop: 1
      type: Regular
    cjet_cand_flavour:
      categories:
      - 0
      - 4
      - 5
      expression: ak.pad_none(objects['candidate_cjet'], target=1).hadronFlavour
      label: Candidate c-jet HadronFlavour
      type: IntCategory
    cjet_cand_pt:
      edges:
      - 20
      - 40
      - 60
      - 80
      - 100
      - 120
      - 150
      - 180
      - 210
      - 240
      - 300
      - 350
      - 400
      expression: objects['candidate_cjet'].pt
      label: Candidate c-jet $p_T$ [GeV]
      type: Variable
    cjet_multiplicity:
      expression: ak.num(objects['cjets'])
      label: c-jets multiplicity
      start: 0
      stop: 14
      type: Integer
    cjet_multiplicity_jet1:
      expression: ak.values_astype(ak.fill_none(ak.pad_none(objects['jets'], target=1)[:,
        0].hadronFlavour == 4, False), int)
      label: c-jet multiplicity(Jet 1)
      start: 0
      stop: 2
      type: Integer
    cjet_multiplicity_jet1and2:
      expression: ak.values_astype(ak.fill_none(ak.pad_none(objects['jets'], target=2)[:,
        0].hadronFlavour == 4, False), int)+ak.values_astype(ak.fill_none(ak.pad_none(objects['jets'],
        target=2)[:, 1].hadronFlavour == 4, False), int)
      label: c-jet multiplicity(Jet 1 + Jet 2)
      start: 0
      stop: 3
      type: Integer
    cjet_multiplicity_jet1and2and3:
      expression: ak.values_astype(ak.fill_none(ak.pad_none(objects['jets'], target=3)[:,
        0].hadronFlavour == 4, False), int)+ak.values_astype(ak.fill_none(ak.pad_none(objects['jets'],
        target=3)[:, 1].hadronFlavour == 4, False), int)+ak.values_astype(ak.fill_none(ak.pad_none(objects['jets'],
        target=3)[:, 2].hadronFlavour == 4, False), int)
      label: c-jet multiplicity(Jet 1 + Jet 2 + Jet 3)
      start: 0
      stop: 4
      type: Integer
    cjet_multiplicity_jet2:
